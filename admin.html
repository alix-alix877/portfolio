<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #f3f4f6; color: #1f2937; padding: 20px; direction: rtl; }
        .wrapper { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #2563eb; margin-bottom: 30px; }
        .token-box { background-color: #fef9c3; padding: 15px; border-radius: 12px; margin-bottom: 25px; }
        .flex-row { display: flex; gap: 10px; margin-top: 5px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; margin-bottom: 15px; outline: none; }
        .btn { padding: 12px 20px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; color: #fff; }
        .btn-yellow { background-color: #ca8a04; }
        .btn-blue { background-color: #2563eb; width: 100%; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1>لوحة تحكم البورتفوليو الشخصي</h1>

        <div class="token-box">
            <label>GitHub Token:</label>
            <div class="flex-row">
                <input type="password" id="github-token" placeholder="Paste Token Here..." style="margin:0;">
                <button onclick="saveToken()" class="btn btn-yellow">حفظ المفتاح</button>
            </div>
        </div>

        <div class="form-group">
            <label>الاسم الكامل:</label>
            <input type="text" id="user-name">
        </div>
        <div class="form-group">
            <label>التخصص المهني:</label>
            <input type="text" id="user-title">
        </div>
        <div class="form-group">
            <label>نبذة عني (About Me):</label>
            <textarea id="user-about" rows="4"></textarea>
        </div>
        <div class="form-group">
            <label>المهارات (افصل بينها بفاصلة ,):</label>
            <input type="text" id="user-skills" placeholder="Excel, Photoshop">
        </div>
        <div class="form-group">
            <label>رابط السيرة الذاتية CV:</label>
            <input type="text" id="user-cv">
        </div>

        <button onclick="updateProfile()" class="btn btn-blue">حفظ البيانات الشخصية التلقائي</button>
    </div>

    <script>
        var owner = "alix-alix877"; 
        var repo = "portfolio"; 

        window.onload = function() {
            var savedToken = localStorage.getItem('gh_token');
            if (savedToken) { document.getElementById('github-token').value = savedToken; }
        };

        function saveToken() {
            var t = document.getElementById('github-token').value;
            localStorage.setItem('gh_token', t);
            alert('Token Saved!');
        }

        function getToken() { return localStorage.getItem('gh_token') || ''; }

        async function updateProfile() {
            var token = getToken();
            if (!token) return alert('Token Empty!');

            var profileData = {
                name: document.getElementById('user-name').value,
                title: document.getElementById('user-title').value,
                about: document.getElementById('user-about').value,
                skills: document.getElementById('user-skills').value,
                cv: document.getElementById('user-cv').value
            };

            var path = "data/profile.json";
            var sha = "";
            
            try {
                var check = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
                    headers: { 'Authorization': 'token ' + token }
                });
                if (check.ok) { var f = await check.json(); sha = f.sha; }
            } catch(e) {}
            var res = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
                method: 'PUT',
                headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: "Update Profile",
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(profileData, null, 2)))),
                    sha: sha ? sha : undefined
                })
            });

            if (res.ok) alert("Success!");
            else alert("Error! Check your token scopes (repo) or spelling.");
        }
    </script>
</body>
</html>
